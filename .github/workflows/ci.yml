name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "perf/**"
      - "chore/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-build:
    name: Check and build
    runs-on: [self-hosted, Windows, X64, obsidian-canvas-utilities]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Normalize Git line endings
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Build
        run: pnpm run build
