name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "perf/**"
      - "chore/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-build:
    name: Check and build
    runs-on: [self-hosted, Windows, X64, obsidian-canvas-utilities]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Normalize checkout line endings
        shell: pwsh
        run: |
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          $files = @(
            "main.ts",
            "manifest.json",
            "package.json",
            "tsconfig.json",
            "esbuild.config.mjs",
            "biome.json",
            "styles.css"
          )

          foreach ($file in $files) {
            $text = [System.IO.File]::ReadAllText($file)
            $text = $text.Replace("`r`n", "`n").Replace("`r", "`n")
            [System.IO.File]::WriteAllText($file, $text, $utf8)
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Build
        run: pnpm run build
